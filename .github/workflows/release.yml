name: Images

# develop -> ghcr.io/replaymark/replaymark:develop, :develop-<sha> (no release)
# main    -> release: :<version>, :<major>.<minor>, :latest, git tag, GitHub release
#            (skipped when tag v<version> already exists)
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  # A release run must never be cancelled halfway (image pushed, tag missing).
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      minor: ${{ steps.plan.outputs.minor }}
      sha: ${{ steps.plan.outputs.sha }}
      build_version: ${{ steps.plan.outputs.build_version }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: |
          version="$(jq -r .version package.json)"
          sha="${GITHUB_SHA::7}"
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/heads/develop)
              {
                echo "channel=develop"
                echo "build=true"
                echo "build_version=${version}-develop+${sha}"
              } >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/main)
              echo "channel=release" >> "$GITHUB_OUTPUT"
              echo "build_version=$version" >> "$GITHUB_OUTPUT"
              if [ -n "$(git ls-remote --tags origin "refs/tags/v${version}")" ]; then
                echo "::notice::Tag v${version} already exists; skipping release."
                echo "build=false" >> "$GITHUB_OUTPUT"
              else
                echo "build=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::notice::No image channel for $GITHUB_REF; nothing to do."
              echo "channel=none" >> "$GITHUB_OUTPUT"
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "build_version=$version" >> "$GITHUB_OUTPUT"
              ;;
          esac

  gate:
    name: CI gate
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  changelog:
    name: Changelog section
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && needs.prepare.outputs.channel == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Extract changelog section
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG.md section for version $VERSION"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  image:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [prepare, gate, changelog]
    # changelog is skipped on develop, which is fine; a failed or cancelled need is not.
    if: ${{ !cancelled() && needs.gate.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.changelog.result) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/replaymark/replaymark
          tags: |
            type=raw,value=develop,enable=${{ needs.prepare.outputs.channel == 'develop' }}
            type=raw,value=develop-${{ needs.prepare.outputs.sha }},enable=${{ needs.prepare.outputs.channel == 'develop' }}
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.channel == 'release' }}
            type=raw,value=${{ needs.prepare.outputs.minor }},enable=${{ needs.prepare.outputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.channel == 'release' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.prepare.outputs.build_version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.build_version }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.channel }}
          cache-to: type=gha,scope=${{ needs.prepare.outputs.channel }},mode=max

  release:
    name: Tag and GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, image]
    if: needs.prepare.outputs.channel == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Tag and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v${VERSION}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file release-notes.md "${flags[@]}"
