name: Images

# develop -> semantic-release prerelease X.Y.Z-develop.N (when commits warrant it)
#            and always :develop, :develop-<sha>
# main    -> semantic-release stable release X.Y.Z; image :X.Y.Z, :X.Y, :latest
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  # A release run must never be cancelled halfway (tag created, image missing).
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.published || 'false' }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Publish image
    runs-on: ubuntu-latest
    needs: release
    # main: only when a release was published; develop: always.
    if: github.ref == 'refs/heads/develop' || needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    env:
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'release' || 'develop' }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: |
          sha="${GITHUB_SHA::7}"
          {
            echo "sha=$sha"
            echo "minor=${VERSION%.*}"
            echo "build_version=${VERSION:-$sha}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/replaymark/replaymark
          tags: |
            type=raw,value=develop,enable=${{ env.CHANNEL == 'develop' }}
            type=raw,value=develop-${{ steps.plan.outputs.sha }},enable=${{ env.CHANNEL == 'develop' }}
            type=raw,value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=${{ steps.plan.outputs.minor }},enable=${{ env.CHANNEL == 'release' }}
            type=raw,value=latest,enable=${{ env.CHANNEL == 'release' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.plan.outputs.build_version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.plan.outputs.build_version }}
          cache-from: type=gha,scope=${{ env.CHANNEL }}
          cache-to: type=gha,scope=${{ env.CHANNEL }},mode=max

  back-merge:
    name: Back-merge into develop
    runs-on: ubuntu-latest
    needs: release
    # Only after a stable release on main. The tag vX.Y.Z lives on main; until
    # main is merged back, develop cannot reach it and semantic-release keeps
    # counting old prereleases (e.g. 1.1.0-develop.3 after 1.1.0).
    if: github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true'
    permissions:
      contents: read
      pull-requests: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      APP_ID: ${{ secrets.RELEASE_APP_ID }}
    steps:
      # PRs created with GITHUB_TOKEN do not trigger workflows, so the required
      # checks of the develop ruleset would never report and the PR could not be
      # merged. A GitHub App token (optional secrets RELEASE_APP_ID and
      # RELEASE_APP_PRIVATE_KEY, see CONTRIBUTING.md) does trigger them. Without
      # the app we fall back to GITHUB_TOKEN and a maintainer must re-run the
      # checks (or close and reopen the PR) and merge it.
      - id: app
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open back-merge pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VIA_APP: ${{ steps.app.outputs.token != '' }}
        run: |
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main; nothing to back-merge."
            exit 0
          fi
          existing="$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Pull request #$existing (main -> develop) is already open."
            exit 0
          fi
          url="$(gh pr create --base develop --head main \
            --title "chore(release): back-merge v${VERSION} into develop" \
            --body "Merges main back into develop so the release tag v${VERSION} is reachable from develop. Without this, semantic-release on develop keeps counting old prereleases. Merge with a merge commit (not squash or rebase); opened automatically by the release workflow.")"
          echo "Opened $url"
          if ! gh pr merge "$url" --auto --merge; then
            echo "::warning::Could not enable auto-merge for $url; merge it manually with a merge commit."
          fi
          if [ "$VIA_APP" != "true" ]; then
            echo "::warning::Created with GITHUB_TOKEN: required checks will not run automatically. Re-run them or close and reopen the PR, then merge. Configure RELEASE_APP_ID/RELEASE_APP_PRIVATE_KEY to automate this."
          fi
