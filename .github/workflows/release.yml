name: Images

# develop -> semantic-release prerelease X.Y.Z-develop.N (when commits warrant it)
#            and always :develop, :develop-<sha>
# main    -> semantic-release stable release X.Y.Z; image :X.Y.Z, :X.Y, :latest
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  # A release run must never be cancelled halfway (tag created, image missing).
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.published || 'false' }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Publish image
    runs-on: ubuntu-latest
    needs: release
    # main: only when a release was published; develop: always.
    if: github.ref == 'refs/heads/develop' || needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    env:
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'release' || 'develop' }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: |
          sha="${GITHUB_SHA::7}"
          {
            echo "sha=$sha"
            echo "minor=${VERSION%.*}"
            echo "build_version=${VERSION:-$sha}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/replaymark/replaymark
          tags: |
            type=raw,value=develop,enable=${{ env.CHANNEL == 'develop' }}
            type=raw,value=develop-${{ steps.plan.outputs.sha }},enable=${{ env.CHANNEL == 'develop' }}
            type=raw,value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=${{ steps.plan.outputs.minor }},enable=${{ env.CHANNEL == 'release' }}
            type=raw,value=latest,enable=${{ env.CHANNEL == 'release' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.plan.outputs.build_version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.plan.outputs.build_version }}
          cache-from: type=gha,scope=${{ env.CHANNEL }}
          cache-to: type=gha,scope=${{ env.CHANNEL }},mode=max
